# Reglas de analisis estatico del proyecto.
#
# El principio VII de la constitucion exige que `flutter analyze` termine sin
# errores ni advertencias nuevas. Por eso las infracciones de estilo se elevan
# a advertencia en lugar de quedarse en informacion, y las que afectan a la
# correccion se elevan a error.

include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Correccion: deben romper el analisis.
    avoid_dynamic_calls: error
    unnecessary_statements: error
    always_use_package_imports: error
    # Claridad del dominio.
    prefer_final_locals: warning
    prefer_const_constructors: warning
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - avoid_dynamic_calls
    - unnecessary_statements
    - always_use_package_imports
    - prefer_final_locals
    - prefer_final_in_for_each
    - unawaited_futures
