name: CI

# Runs on every pull request into main and on everything that lands on main.
#
# It verifies exactly what used to be verified by hand before each commit:
# domain, UI, static analysis, web build, security rules, and the checksums of
# the normative methodology documents. The difference is that now nobody can
# forget.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Two pushes in a row to the same branch cancel the first run: there is no point
# verifying a commit that has already been superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only. No job in this workflow writes to the repository or needs secrets:
# the rules tests run against the emulators with a dummy project id.
permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.2

jobs:
  domain:
    name: Domain, UI and analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        # The project requires this to come out clean: principle VII of the
        # constitution, verifiable simplicity.
        run: flutter analyze

      - name: Domain, data and UI tests
        run: flutter test

      - name: Domain boundary
        # Redundant with `flutter test`, but called out separately because it is
        # principle II: `lib/dominio/` must not import Flutter or Firebase. When
        # it breaks, you want to see it without digging through 700 tests.
        run: flutter test test/dominio/arquitectura_test.dart

      - name: Normative document checksums
        # If a normative document changed without bumping the manifest version,
        # approved plans end up stamped with a version that no longer describes
        # what was applied to them (FR-026).
        run: dart run tool/verificar_metodologia.dart

      - name: Web build
        run: flutter build web --release

  rules:
    # DO NOT RENAME. This exact string is a required status check in the
    # repository ruleset, and a required check that never reports blocks every
    # pull request forever rather than failing visibly.
    #
    # It happened: adding the server tests to this job renamed it, and the
    # ruleset went on waiting for a check that no longer existed. The job also
    # runs the server suite now; what it covers belongs in the step names
    # below, not in a name that something else depends on.
    name: Firestore security rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            firebase/package-lock.json
            firebase/functions/package-lock.json

      - uses: actions/setup-java@v4
        # The Firestore emulator runs on the JVM.
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci
        working-directory: firebase

      - name: Install server dependencies
        run: npm ci
        working-directory: firebase/functions

      - name: Install the Firebase CLI
        # Pinned and deliberately kept out of package.json: as a devDependency
        # it added eleven security advisories to the repository's dependency
        # graph, and here it is only needed to start the emulators.
        run: npm install -g firebase-tools@15.29.0

      - name: Rules tests, with their negative cases
        # Deny by default: an approved or published plan is immutable, and
        # nobody reads a swimmer's data without permission. Principle III.
        run: npm test
        working-directory: firebase

      - name: Server tests
        # The consent gate is enforced here, so it is tested here. A server
        # surface without tests in CI is a surface that breaks silently.
        run: npm test
        working-directory: firebase/functions
